<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>모의 주식 트레이딩</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">
  <header class="top-bar">
    <h1>모의 주식 트레이딩</h1>
    <div class="summary">
      <div class="summary-item">
        <span class="label">총 자산가치</span>
        <span class="value" id="total-value">$0.00</span>
      </div>
      <div class="summary-item">
        <span class="label">현금</span>
        <span class="value" id="cash-value">$0.00</span>
      </div>
      <div class="summary-item">
        <span class="label">전체 수익률</span>
        <span class="value return-value" id="total-return">0.00%</span>
      </div>
    </div>
    <button id="reset-btn" class="reset-btn" type="button">초기화</button>
  </header>

  <main>
    <section class="stock-grid" id="stock-grid" aria-label="종목 목록"></section>

    <section class="transactions">
      <h2>거래 내역</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>시간</th>
              <th>종목</th>
              <th>구분</th>
              <th>수량</th>
              <th>가격</th>
              <th>금액</th>
            </tr>
          </thead>
          <tbody id="transaction-body"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/market.js"></script>
<script src="js/portfolio.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
